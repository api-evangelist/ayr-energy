name: Ayr Energy
description: 'Ayr Energy is a power grid equipment manufacturer founded in 2024 and headquartered in
  Mountain View, California, backed by General Catalyst. The company designs and builds custom-engineered
  electrical infrastructure - power, distribution, and special-purpose transformers, high-voltage circuit
  breakers, and medium-voltage switchgear - for renewable energy, data center, utility, industrial, and
  oil & gas customers. Ayr operates six manufacturing facilities across India (Gujarat, Uttar Pradesh,
  Maharashtra, and Tamil Nadu) and emphasizes accelerated delivery of grid hardware in months rather than
  years. Ayr Energy does not currently publish a public API, developer portal, or machine-readable API
  surface; this profile captures company identity for the API Evangelist network.'
